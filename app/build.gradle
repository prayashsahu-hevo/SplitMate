plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.prayash.splitmate'
    compileSdk 34

    defaultConfig {
        applicationId "com.prayash.splitmate"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // A fixed, committed key so every build (local or CI) is signed identically.
        // This lets new builds install as UPDATES — settings and permissions are preserved.
        // It's a throwaway key for a personal sideloaded app; the repo is private.
        shared {
            storeFile rootProject.file('keystore/splitmate.jks')
            storePassword 'splitmate'
            keyAlias 'splitmate'
            keyPassword 'splitmate'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    testImplementation 'junit:junit:4.13.2'
}
