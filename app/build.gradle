plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.prayash.splitmate'
    compileSdk 34

    defaultConfig {
        applicationId "com.prayash.splitmate"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // The release key is never committed. Official builds get it from the environment
    // (CI decodes it from a repository secret); a local build can point at its own via
    // keystore.properties. Without either, builds fall back to Android's debug key so
    // anyone can clone this repo and build it without any setup.
    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    def resolvedStorePath = System.getenv('SPLITMATE_KEYSTORE') ?: keystoreProps['storeFile']
    def hasSigningKey = resolvedStorePath != null && rootProject.file(resolvedStorePath).exists()

    signingConfigs {
        if (hasSigningKey) {
            shared {
                storeFile rootProject.file(resolvedStorePath)
                storePassword System.getenv('SPLITMATE_STORE_PASSWORD') ?: keystoreProps['storePassword']
                keyAlias System.getenv('SPLITMATE_KEY_ALIAS') ?: keystoreProps['keyAlias']
                keyPassword System.getenv('SPLITMATE_KEY_PASSWORD') ?: keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            if (hasSigningKey) signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigningKey) signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'

    testImplementation 'junit:junit:4.13.2'
}
