name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:      # lets you trigger a build manually from the Actions tab

permissions:
  contents: write         # needed to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # packages: '' skips the action's default install of the legacy "tools" package,
      # which Google removed from the SDK repository — leaving it on fails the job.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # The signing key is never in the repo. Decode it from a secret so official builds
      # keep the same signature and install in place; the file is cleaned up afterwards.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SPLITMATE_KEYSTORE_B64 }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_B64" | base64 -d > keystore/splitmate.jks

      - name: Build debug APK
        env:
          SPLITMATE_KEYSTORE: keystore/splitmate.jks
          SPLITMATE_STORE_PASSWORD: ${{ secrets.SPLITMATE_STORE_PASSWORD }}
          SPLITMATE_KEY_ALIAS: ${{ secrets.SPLITMATE_KEY_ALIAS }}
          SPLITMATE_KEY_PASSWORD: ${{ secrets.SPLITMATE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Remove signing key
        if: always()
        run: rm -f keystore/splitmate.jks

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SplitMate.apk

      # Stable download URL: .../releases/download/latest/SplitMate.apk
      - name: Publish to 'latest' release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SplitMate (latest build)
          body: "Auto-built by GitHub Actions. Install on your phone; it updates in place."
          files: SplitMate.apk

      # Also available under the run's Artifacts, as a fallback
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SplitMate-apk
          path: SplitMate.apk
